name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: Bundle (ubuntu-22.04)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev pkg-config clang cmake file patchelf xdg-utils
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Restore sherpa-onnx prebuilt binaries
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sherpa-rs
          key: sherpa-rs-${{ runner.os }}-v1
      - name: Force sherpa-rs-sys rebuild when the native cache is missing
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: cargo clean -p sherpa-rs-sys
      - name: Build bundles
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/target/release/deps
        run: bunx tauri build
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: voice-dictation-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
