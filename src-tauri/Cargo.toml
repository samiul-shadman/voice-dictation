[package]
name = "local-audio-transcription-tool-v2"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "local_audio_transcription_tool_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
hound = "3.5"
libc = "0.2"
regex = "1"
toml = "0.8"
enigo = "=0.5.0"
# pinned: sherpa-rs 0.6.8 (build downloads per-target sherpa-onnx v1.12.9 prebuilt
# binaries: linux-x64, linux-arm64, mac-x64/arm64, win-x64 shared — see dist.json)
sherpa-rs = "=0.6.8"
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["mp3", "pcm", "flac", "vorbis", "isomp4", "aac", "wav", "ogg"] }
rubato = "5.0.0"
mp3lame-encoder = "0.2.5"
audioadapter-buffers = "5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[dev-dependencies]
tempfile = "3"
